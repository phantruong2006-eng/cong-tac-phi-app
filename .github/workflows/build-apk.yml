name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Doc so phien ban
        run: echo "VER=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Ghi phien ban vao app
        run: sed -i "s/__APP_VERSION__/${VER}/" www/index.html

      - name: Cai thu vien
        run: npm install

      - name: Tao project Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Dung ma khoa co dinh (de cai de len ban cu)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../keystore/ctp-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -12 android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Doi ten APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CTP-${VER}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CTP-${{ env.VER }}
          path: CTP-${{ env.VER }}.apk

      - name: Dang len Releases (de tai ve dien thoai)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: CTP ${{ env.VER }}
          files: CTP-${{ env.VER }}.apk
          make_latest: true
