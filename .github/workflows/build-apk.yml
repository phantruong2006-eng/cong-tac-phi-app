name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cai thu vien
        run: npm install

      - name: Tao project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Doi ten APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cong-tac-phi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cong-tac-phi-apk
          path: cong-tac-phi.apk

      - name: Dang len Releases (de tai ve dien thoai)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cong tac phi (ban moi nhat)
          files: cong-tac-phi.apk
