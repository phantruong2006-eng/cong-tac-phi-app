<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CTP</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#d9dfe7;--pri:#1f6feb}
  @media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1d232d;--ink:#e8ecf2;--mut:#98a2b3;--line:#323b49;--pri:#5b9bff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:26px;margin:0 0 2px}
  .mut{color:var(--mut)}
  a.tool{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;text-decoration:none;color:var(--ink)}
  a.tool:active{transform:scale(.99)}
  .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;flex:none;color:#fff}
  .t{font-weight:700;font-size:18px}
  .d{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CTP</h1>
  <p class="mut" style="margin:0 0 6px">Phiên bản __APP_VERSION__</p>
  <a class="tool" href="ctp.html">
    <span class="ic" style="background:#1f6feb">🗓</span>
    <span><span class="t">Công tác phí</span><br><span class="d">Nhập số ngày → tạo file Excel tháng trước, gửi kế toán</span></span>
  </a>
  <a class="tool" href="bionote.html">
    <span class="ic" style="background:#1f3864">🧪</span>
    <span><span class="t">Đặt hàng Bionote</span><br><span class="d">Nhập số lượng → tự chia cho khách, xuất file Excel</span></span>
  </a>
</div>
</body>
</html>
